name: "Release"

# Builds every platform and attaches the installers, the signed updater
# bundles and latest.json to a DRAFT GitHub Release `v<version>` (version from
# src-tauri/tauri.conf.json). Review the draft, then publish it by hand.
#
# Trigger: Actions -> Release -> Run workflow, or push a `v*` tag. Both paths
# funnel through the same job, which reuses an existing draft for the tag
# instead of creating a second release (so re-runs and tag pushes are safe).
# See docs/RELEASING.md.

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  create-release:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    outputs:
      release-id: ${{ steps.create-release.outputs.result }}
      version: ${{ steps.get-version.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Get version from tauri.conf.json
        id: get-version
        shell: bash
        run: |
          VERSION=$(grep -o '"version": "[^"]*"' src-tauri/tauri.conf.json | head -n1 | cut -d'"' -f4)
          echo "Application version from tauri.conf.json: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check versions are in sync
        shell: bash
        run: |
          conf='${{ steps.get-version.outputs.version }}'
          pkg=$(grep -m1 '"version"' package.json | cut -d'"' -f4)
          crate=$(grep -m1 '^version' src-tauri/Cargo.toml | cut -d'"' -f2)
          echo "tauri.conf.json=$conf package.json=$pkg Cargo.toml=$crate"
          if [ -z "$conf" ] || [ "$conf" != "$pkg" ] || [ "$conf" != "$crate" ]; then
            echo "::error::Version mismatch between tauri.conf.json, package.json and src-tauri/Cargo.toml"
            exit 1
          fi
          if [ "${{ github.ref_type }}" = "tag" ] && [ "${{ github.ref_name }}" != "v$conf" ]; then
            echo "::error::Tag ${{ github.ref_name }} does not match app version v$conf"
            exit 1
          fi

      - name: Create or reuse draft release
        id: create-release
        uses: actions/github-script@v9
        with:
          script: |
            const tag = `v${{ steps.get-version.outputs.version }}`
            const releases = await github.paginate(github.rest.repos.listReleases, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100,
            })
            const existing = releases.find((r) => r.tag_name === tag)
            if (existing) {
              if (!existing.draft) {
                core.setFailed(`Release ${tag} is already published. Bump the version before releasing again.`)
                return
              }
              core.info(`Reusing existing draft release ${tag} (id ${existing.id})`)
              return existing.id
            }
            const { data } = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: tag,
              target_commitish: context.sha,
              name: tag,
              draft: true,
              prerelease: false,
              generate_release_notes: true
            })
            return data.id

  publish-tauri:
    permissions:
      contents: write
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "macos-26" # for Arm based macs (M1 and above). Uses macOS 26 for Apple Intelligence SDK.
            args: "--target aarch64-apple-darwin"
            target: "aarch64-apple-darwin"
          - platform: "macos-latest" # for Intel based macs (cross-compiled on the Apple Silicon runner).
            args: "--target x86_64-apple-darwin"
            target: "x86_64-apple-darwin"
          - platform: "ubuntu-22.04" # Build .deb on 22.04
            args: "--bundles deb"
            target: "x86_64-unknown-linux-gnu"
          - platform: "ubuntu-24.04" # Build AppImage and RPM on 24.04
            args: "--bundles appimage,rpm"
            target: "x86_64-unknown-linux-gnu"
          - platform: "ubuntu-24.04-arm" # Build for ARM64 Linux
            args: "--bundles appimage,deb,rpm"
            target: "aarch64-unknown-linux-gnu"
          - platform: "windows-latest"
            args: ""
            target: "x86_64-pc-windows-msvc"
          - platform: "windows-11-arm" # for ARM64 Windows runner
            args: "--target aarch64-pc-windows-msvc"
            target: "aarch64-pc-windows-msvc"

    uses: ./.github/workflows/build.yml
    with:
      platform: ${{ matrix.platform }}
      target: ${{ matrix.target }}
      build-args: ${{ matrix.args }}
      sign-binaries: true
      asset-prefix: "xerra"
      upload-artifacts: false
      release-id: ${{ needs.create-release.outputs.release-id }}
      # Releases always build from scratch — never restore the Rust cache, so a
      # stale cached native lib can never be linked into a shipped artifact.
      no-cache: true
    secrets: inherit
